# WeaveNet 织网穿透 服务编排（Go 全栈轻量化版）
# 3 容器：panel / frps / emergency（已去除 Redis）
# 文档：CQFISH&喵酱出品

services:
  weave-panel:
    build:
      context: ../panel-go
      dockerfile: Dockerfile
    container_name: weave-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEAVE_ENV: production
      DATABASE_URL: sqlite:////app/data/weavenet.db
    volumes:
      - sqlite_data:/app/data
      - ../panel/logs:/app/logs
      - ../panel/static/downloads:/app/static/downloads:ro
    ports:
      - "8100:8000"
    networks:
      - weave-net

  weave-frps:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: weave-frps
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frps.toml:/app/frps.toml:ro
    ports:
      - "7000:7000"
      - "8080:8080"
      - "8443:8443"
      - "20000-39999:20000-39999"
    depends_on:
      - weave-panel
    networks:
      - weave-net

  weave-emergency:
    build:
      context: ../emergency
      dockerfile: Dockerfile
    container_name: weave-emergency
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../emergency/emergency.conf:/app/emergency.conf
      - ../emergency/logs:/app/logs
      - sqlite_data:/app/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9001:9001"
    networks:
      - weave-net

volumes:
  sqlite_data:

networks:
  weave-net:
    driver: bridge
